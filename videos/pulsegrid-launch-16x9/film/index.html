<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pulsegrid — launch ad</title>
<style>
  /* One display face, one UI face. Point these at the brand's real files in assets/fonts/ (capture.mjs lists them). */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/display.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/ui.woff2) format('woff2'); font-weight: 100 900; }
  :root {
    /* style guide tokens: ONE accent unless the brief says otherwise */
    --bg: #F4F2EE; --ink: #111113; --ink-2: #6B6A66; --accent: #2F5BFF; --card: #FFFFFF;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0;
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .display { font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: -0.045em;
             line-height: 0.95; white-space: nowrap; }
  /* a line is a mask: words rise through it. Padding keeps descenders; start words >= 140% below so no sliver shows. */
  .line { position: absolute; overflow: hidden; padding: 0.08em 0.04em 0.18em; margin: -0.08em -0.04em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .card { position: absolute; background: var(--card); border-radius: 28px;
          box-shadow: 0 2px 6px rgba(0,0,0,.05), 0 30px 80px -20px rgba(0,0,0,.22); }
  body.play { display: block; }
  /* Pulsegrid film */
  .ui { font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; }
  .tnum { font-variant-numeric: tabular-nums; }
  .ans { letter-spacing: -0.025em; }
  .box { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 50% 50%;
         box-shadow: 0 2px 6px rgba(17,17,19,.06), 0 34px 80px -24px rgba(17,17,19,.28); }
  .content { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
  .dots { position: absolute; left: -120px; top: -120px; width: 2160px; height: 1320px;
          background-image: radial-gradient(circle, #DCD8D0 0 2px, transparent 2.6px); background-size: 40px 40px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="film.js"></script>
</body>
</html>
